<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Butterfly swarm · hello</title>
    <meta name="description" content="A butterfly swarm that spells hello in a different language every time you disturb it. Built with three.js and TSL." />
    <!-- Inline so the browser stops asking for /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f0913f' d='M15 16C11 9 4 5 3 9c-1 4 3 8 12 7zM17 16c4-7 11-11 12-7 1 4-3 8-12 7z'/%3E%3Cpath fill='%23e07a5f' d='M15 16c-4 6-11 10-12 6-1-4 3-7 12-6zM17 16c4 6 11 10 12 6 1-4-3-7-12-6z'/%3E%3Cpath fill='%23e8ded0' d='M16 6c1 0 1.3 1 1.3 3v14c0 2-.3 3-1.3 3s-1.3-1-1.3-3V9c0-2 .3-3 1.3-3z'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #0a101c;
        --ember: #f0913f;
        --pale: #e8ded0;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--pale);
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        /* dragging on a phone must steer the swarm, not scroll the page */
        touch-action: none;
        cursor: crosshair;
      }

      /* A single vignette sold as atmosphere. The swarm is the hero; nothing
         else on this page is allowed to compete with it. */
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(4, 7, 14, 0.72) 100%);
      }

      .mark,
      #status {
        position: fixed;
        z-index: 2;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(232, 222, 208, 0.5);
        pointer-events: none;
        transition: opacity 900ms ease;
      }

      .mark {
        top: max(20px, env(safe-area-inset-top));
        left: 20px;
        line-height: 1.9;
      }

      .mark b {
        display: block;
        font-weight: 500;
        color: var(--pale);
      }

      #status {
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 20px;
        color: rgba(240, 145, 63, 0.85);
      }

      /* The word the butterflies are spelling, named. Without it a viewer who
         does not read the script sees a pretty shape instead of a greeting. */
      #caption {
        position: fixed;
        z-index: 2;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.28em;
        color: rgba(232, 222, 208, 0.42);
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 1400ms ease, transform 1400ms ease;
      }

      #caption.is-visible {
        opacity: 1;
        transform: none;
      }

      #status.is-hidden { opacity: 0; }
      #status.is-error {
        color: #ff8f8f;
        letter-spacing: 0.08em;
        text-transform: none;
      }

      body { opacity: 0; transition: opacity 1200ms ease; }
      body.is-ready { opacity: 1; }

      .debug-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 3;
        display: none;
        padding: 12px 14px;
        border: 1px solid rgba(232, 222, 208, 0.16);
        background: rgba(6, 10, 20, 0.72);
        backdrop-filter: blur(6px);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.7;
        white-space: pre;
        color: rgba(232, 222, 208, 0.82);
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        body, #status, .mark, #caption { transition: none; }
      }

      @media (max-width: 720px) {
        .mark { font-size: 9px; }
        /* Narrow enough that a centred caption would run into the instruction
           in the corner, so it steps up a line. */
        #caption { bottom: calc(max(20px, env(safe-area-inset-bottom)) + 26px); }
      }
    </style>

    <!-- Both `three` and `three/webgpu` must resolve to the *same* file:
         three.tsl.js imports 'three/webgpu' internally, and two copies of the
         library would mean TSL nodes the renderer does not recognise. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <canvas id="stage"></canvas>
    <div class="vignette"></div>

    <div class="mark">
      <b>Butterfly swarm</b>
      hello, in every language
    </div>

    <p id="status">starting</p>
    <p id="caption" aria-live="polite"></p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
